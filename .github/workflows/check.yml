name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 本站自己的检测 Worker (只认本账号 workers.dev 子域)
          CHECK_WORKER: "https://autumn-sea-4d92.liuy90866.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "48"
          CHECK_TIMEOUT: "45"
          # 每个 SSTP 节点生成几个入口行 (1 = 一行一个节点, 最接近手动维护)
          EDGE_COPIES: "1"
          # 额外 SSTP 节点源 (可选, 逗号分隔的 URL 或仓库内文件; 每行一个 host:port)
          # 实测这份清单的 443 端口节点在你的 Worker 上通过率很低, 需要时再打开:
          # EXTRA_SSTP: "https://raw.githubusercontent.com/Delta-Kronecker/Vpn-Gate/main/sstp_hosts.txt"
          # 全球节点池: 自动从 VPN Gate 滚动池取多国节点 (只取 Cloudflare 预探测可达的)
          POOL_ENABLED: "1"
          # 目标国家候选池上限，给 200 个最终节点留出足够候选
          POOL_PER_COUNTRY: "60"
          # 使用实测延迟 ≤300ms 的 200 个优选入口域名
          EDGE_CSV: "entries-final-200.csv"
          # 优选入口域名自身的延迟上限
          MAX_ENTRY_LATENCY_MS: "300"
          # 节点网络延迟 = 客户端到优选入口的实测延迟, 只保留 ≤ 300ms
          # 修正: Worker responseTime 是 SSTP 建链耗时, 不是 ping; 不能加进网络延迟
          MAX_LATENCY_MS: "300"
          # SSTP 建链耗时上限 (TCP+TLS+认证; 0 = 不限制)
          MAX_HANDSHAKE_MS: "5000"
          # 优选入口只取最快的 300 个
          EDGE_MAX_ENTRIES: "300"
          # 最终节点数上限 (按延迟从快到慢保留)
          MAX_NODES: "200"
          # 只保留这些地区: 美/日/韩/俄/印 + 中国周边; 其它国家一律不保留 (也不参与补位)
          TARGET_COUNTRIES: "US,JP,KR,RU,IN,MN,VN,TH,MM,LA,KH,MY,SG,PH,ID,PK,BD,NP,LK,KZ,KG,TJ,UZ,TM,TW,HK,MO"
          # 每国最多 20 个, 节点多的国家只保留约 20
          PER_COUNTRY_MAX: "20"
          # 可用节点不足 3 个的国家整国剔除 (只有 1-2 个节点的不要)
          MIN_PER_COUNTRY: "3"
          # 0 = 每国 20 是硬上限 (总数可能不到 200 也不跨国凑数); 1 = 不足 200 时从目标国家溢出节点补位
          TOP_UP_TO_MAX_NODES: "0"
          # 住宅与机房都保留
          REQUIRE_RESIDENTIAL: "0"
          # 不限制 ASN 类型
          REQUIRE_ISP_ASN: "0"
          # 本轮网络不稳定, 关闭额外的 IP 纯净度过滤, 优先保留可用节点
          PURITY_ENABLED: "0"
          PURITY_REQUIRE_HOSTING_FALSE: "1"
          PURITY_REQUIRE_PROXY_FALSE: "0"
          PURITY_REQUIRE_NOT_MOBILE: "1"
          PURITY_FAIL_OPEN: "1"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://liuy90866-alt.github.io/V2/ (deploy outcome: ${{ steps.deployment.outcome }})"'


